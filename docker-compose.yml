version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: trashbusters_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trashbusters_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: