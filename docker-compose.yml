services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: trashbusters_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trashbusters_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mapeia os arquivos SQL locais para serem executados ao iniciar o banco
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - trashbusters-net

volumes:
  pgdata:

networks:
  trashbusters-net: