server.port=${SERVER_PORT:8080}

spring.application.name=trashbusters

# Configuração do Banco de Dados PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/trashbusters_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do Hibernate (Criação automática das tabelas no MVP)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Google AI Studio / Gemini Developer API. Defina GOOGLE_API_KEY no ambiente.
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.8-flash}
spring.ai.google.genai.chat.max-output-tokens=1024
spring.ai.google.genai.chat.temperature=0

# Uma tentativa por modelo evita que retries automáticos deixem a requisição pendente por minutos.
spring.ai.retry.max-attempts=1

# Limita o upload antes de ele chegar ao Gemini.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# O fallback pode ser trocado no .env sem reconstruir a imagem.
trashbusters.ai.primary-model=${GEMINI_MODEL:gemini-3.8-flash}
trashbusters.ai.fallback-model=${GEMINI_FALLBACK_MODEL:gemini-3.5-flash}

# Chave usada para assinar os JWTs da API.
api.security.token.secret=${API_SECURITY_TOKEN_SECRET:my-secret-key}
