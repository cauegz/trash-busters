server.port=8080

spring.application.name=trashbusters

# Configuração do Banco de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/trashbusters_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do Hibernate (Criação automática das tabelas no MVP)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuração do Google GenAI (Gemini API Key direta do AI Studio)
spring.ai.google.genai.api-key=${GCP_API_KEY}
spring.ai.google.genai.project-id=gen-lang-client-0637994765
