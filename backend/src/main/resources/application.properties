server.port=${SERVER_PORT:8080}

spring.application.name=trashbusters

management.metrics.enable.jvm=false
management.metrics.enable.system=false

# Configuração do Banco de Dados PostgreSQL
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
spring.datasource.url=jdbc:${DATABASE_URL:postgresql://localhost:5432/trashbusters_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do Hibernate (Criação automática das tabelas no MVP)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2

# Configuração agnóstica do provedor de IA.
# O adaptador instalado atualmente é Google GenAI; para trocar de provedor,
# substitua o starter e o adaptador em infra/ai.
ai.provider.name=${AI_PROVIDER_NAME:default}
ai.provider.api-key=${AI_API_KEY:}
ai.provider.model=${AI_MODEL:gemini-3.5-flash}

# Uma tentativa por modelo evita que retries automáticos deixem a requisição pendente por minutos.
spring.ai.retry.max-attempts=1

# Limita o upload antes de ele chegar ao provedor de IA.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.file-size-threshold=1MB

# Mantém as imagens pequenas antes de enviá-las à IA e ao armazenamento.
app.image.max-dimension=${IMAGE_MAX_DIMENSION:1600}

# Chave usada para assinar os JWTs da API.
api.security.token.secret=${API_SECURITY_TOKEN_SECRET:my-secret-key}
