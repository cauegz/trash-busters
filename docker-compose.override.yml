# Ambiente de desenvolvimento: não recria o container a cada alteração.
# Roda a API direto pelo Maven com Spring Boot DevTools (hot reload).
services:
  app:
    image: maven:3.9.9-eclipse-temurin-21
    volumes:
      - ./pom.xml:/workspace/pom.xml
      - ./src:/workspace/src
      - ~/.m2:/root/.m2
    command: ["mvn", "spring-boot:run"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trashbusters_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?Defina GOOGLE_API_KEY no arquivo .env}
      API_SECURITY_TOKEN_SECRET: ${API_SECURITY_TOKEN_SECRET:-my-secret-key}
      SERVER_PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"
